# Site
title: "CompInt’27"
description: >-
  ACM Conference on Computational Interaction (CompInt) and Summer School on
  Computational Interaction
preposition: "at"
url: ""      # TODO: set to the custom domain once it is pointed at GitHub Pages
baseurl: ""
timezone: Europe/London
theme: jekyll-theme-conference

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md
  - Makefile
  - requirements.txt
  - vendor
  - photos
  - schemas
  - scripts

# Collections required by the theme (names are fixed). Empty for now.
collections:
  talks:
    output: true
    permalink: /:collection/:title/
  speakers:
    output: true
    permalink: /:collection/:title/
  rooms:
    output: true
    permalink: /:collection/:title/

defaults:
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
  - scope:
      path: ""
      type: speakers
    values:
      layout: speaker
  - scope:
      path: ""
      type: rooms
    values:
      layout: room

# Theme settings, see https://github.com/DigitaleGesellschaft/jekyll-theme-conference
conference:
  lang: en
  # Off while there are no speakers: the theme would otherwise show a
  # "no speakers" warning bar on every page.
  show_errors: false

  navigation:
    links:
      - name: Committee
        relative_url: /committee/
      - name: Timetable
        relative_url: /timetable/
      - name: Call for papers
        relative_url: /cfp/

  talks:
    # Colours of the timetable blocks and its legend (copied from the organisers'
    # spreadsheet). A _talks/ file picks one with `track:`; blocks without one are white.
    # Colours are Bootstrap names: primary, secondary, success, danger, warning, info, light, dark.
    tracks:
      - name: Whole symposium
        color: danger
      - name: Keynote (all)
        color: primary
      - name: Academics
        color: warning
      - name: Students
        color: success
      - name: Social
        color: info
    tags: []
