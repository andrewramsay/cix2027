# Previous editions of the event, shown on the History page (newest first,
# whatever order they are listed in here).
# Checked by scripts/validate.py against schemas/editions.schema.json.
#
# Each edition has:
#   year      the year it was held
#   name      optional, shown above the host (e.g. the event's own name)
#   host      the host institution(s)
#   location  city and country
#   website   optional, the edition's own website
#   logos     one or more logos; file is a file name in logos/editions/,
#             url is where clicking the logo goes (optional)
# Earlier editions were copied from https://s3cix.computationalinteraction.org/editions/

